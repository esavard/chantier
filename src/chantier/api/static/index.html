<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chantier</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e2e0da;
    --accent: #c2410c; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --run: #1d4ed8;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161614; --panel: #20201d; --ink: #ecebe6; --muted: #9b9a94; --line: #34332f;
            --accent: #fb923c; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --run: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  header h1 span { color: var(--accent); }
  header .muted { color: var(--muted); }
  select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .strip { display: flex; gap: 24px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px 20px; }
  .board { display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); gap: 10px; overflow-x: auto; }
  .col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line);
          border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card .id { font-weight: 600; word-break: break-all; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .s-draft { border-left-color: var(--warn); } .s-running, .s-reviewing { border-left-color: var(--run); }
  .s-awaiting_merge { border-left-color: var(--accent); } .s-blocked { border-left-color: var(--bad); }
  .s-done { border-left-color: var(--ok); opacity: .75; }
  aside h2 { font-size: 13px; margin: 0 0 8px; }
  .att { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .att .kind { font-size: 11px; text-transform: uppercase; color: var(--accent); }
  .att pre, .detail pre { white-space: pre-wrap; margin: 4px 0 0; font-size: 12px; }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink);
           width: min(820px, 94vw); max-height: 88vh; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .detail { padding: 18px 20px; }
  .detail h3 { margin: 0 0 4px; }
  .detail table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
  .detail td, .detail th { text-align: left; border-bottom: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
           padding: 6px 12px; cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { color: var(--muted); font-style: italic; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1><span>▲</span> chantier</h1>
  <span class="muted">opinionated code factory</span>
  <select id="project"><option value="">all projects</option></select>
  <span id="status" class="muted"></span>
</header>
<div class="strip" id="metrics"></div>
<main>
  <section class="board" id="board"></section>
  <aside><h2>Needs a human</h2><div id="attention"></div></aside>
</main>
<dialog id="dialog"><div class="detail" id="detail"></div></dialog>

<script>
const COLUMNS = [["draft","Draft"],["ready","Ready"],["running","Running"],["reviewing","Review"],
                 ["awaiting_merge","To merge"],["blocked","Blocked"],["done","Done"]];
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls;
                                 if (text !== undefined) e.textContent = text; return e; };
const money = (v) => "$" + (v || 0).toFixed(2);

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}

async function refresh() {
  const project = $("project").value;
  const q = project ? "?project=" + encodeURIComponent(project) : "";
  const [tickets, attention, metrics, status] = await Promise.all([
    api("/api/tickets" + q), api("/api/attention"), api("/api/metrics" + q).catch(() => null), api("/api/status")]);
  renderBoard(tickets); renderAttention(attention); renderMetrics(metrics);
  $("status").textContent = (status.draining ? "draining · " : "") + status.running.length + " running";
}

function renderBoard(tickets) {
  const board = $("board"); board.replaceChildren();
  for (const [stage, label] of COLUMNS) {
    const items = tickets.filter(t => t.stage === stage);
    const col = el("div", "col"); col.append(el("h2", null, `${label} (${items.length})`));
    for (const t of items) {
      const card = el("div", "card s-" + t.stage);
      card.append(el("div", "id", t.id.split("/").slice(1).join("/")));
      const meta = [t.project, t.kind === "plan" ? "plan" : null,
                    t.attempt ? `try ${t.attempt + 1}` : null, t.ladder_step ? `escalated ×${t.ladder_step}` : null];
      card.append(el("div", "meta", meta.filter(Boolean).join(" · ")));
      card.onclick = () => openTicket(t.id);
      col.append(card);
    }
    board.append(col);
  }
}

function renderAttention(items) {
  const box = $("attention"); box.replaceChildren();
  if (!items.length) { box.append(el("div", "empty", "Nothing. The factory is on its own.")); return; }
  for (const a of items) {
    const div = el("div", "att");
    div.append(el("div", "kind", a.kind.replace("_", " ")), el("div", null, a.ticket || a.project),
               el("pre", null, a.message));
    if (a.ticket) { div.style.cursor = "pointer"; div.onclick = () => openTicket(a.ticket); }
    box.append(div);
  }
}

function renderMetrics(m) {
  const strip = $("metrics"); strip.replaceChildren();
  if (!m) { strip.append(el("span", "empty", "Metrics need a reference model in pricing.")); return; }
  const s = m.savings;
  const stats = [["frontier spend", money(s.frontier_spend_usd)],
                 ["local share of runs", Math.round(s.local_share * 100) + "%"],
                 ["estimated savings", money(s.estimated_savings_usd)],
                 ["redone on frontier", money(s.local_waste_usd)],
                 ["local energy", money(s.energy_usd)]];
  for (const [label, value] of stats) {
    const d = el("div", "stat"); d.append(el("b", null, value), el("small", null, label)); strip.append(d);
  }
}

async function openTicket(id) {
  const t = await api("/api/tickets/" + id);
  const d = $("detail"); d.replaceChildren();
  d.append(el("h3", null, t.title), el("div", "meta", `${t.id} · ${t.stage} · ${t.spec_path} · branch ${t.branch || "-"}`));
  if (t.depends_on.length) d.append(el("div", "meta", "depends on " + t.depends_on.join(", ")));
  const actions = el("div", "actions");
  const act = async (verb, body) => {
    try { await api(`/api/tickets/${t.id}/${verb}`, {method: "POST", headers: {"Content-Type": "application/json"},
                     body: body ? JSON.stringify(body) : undefined}); $("dialog").close(); refresh(); }
    catch (e) { alert(e.message); }
  };
  if (t.stage === "draft") actions.append(button("Approve spec", "primary", () => act("approve")),
                                          button("Cancel", null, () => ask("Reason?", r => act("reject", {reason: r}))));
  if (t.stage === "awaiting_merge") actions.append(button("Merge", "primary", () => act("approve")),
                                                   button("Send back", null, () => ask("What must change?", r => act("reject", {reason: r}))));
  if (t.stage === "blocked") actions.append(button("Unblock", "primary", () => act("unblock")),
                                            button("Cancel", null, () => ask("Reason?", r => act("reject", {reason: r}))));
  actions.append(button("Close", null, () => $("dialog").close()));
  d.append(actions);
  if (t.feedback) { d.append(el("h4", null, "Feedback for the next attempt"), el("pre", null, t.feedback)); }
  d.append(table(["attempt", "phase", "executor", "outcome", "tokens", "cost", "time", "detail"],
    t.runs.map(r => [r.attempt, r.phase, r.executor, r.outcome || "running", r.tokens.toLocaleString(),
                     money(r.cost_usd), Math.round(r.seconds) + "s", (r.detail || "").split("\n")[0]])));
  d.append(table(["when", "from", "to", "by", "cause"],
    t.transitions.map(x => [x.at.slice(5, 16).replace("T", " "), x.from, x.to, x.actor, x.cause])));
  $("dialog").showModal();
}

function button(label, cls, onclick) { const b = el("button", cls, label); b.onclick = onclick; return b; }
function ask(question, then) { const r = prompt(question); if (r) then(r); }
function table(headers, rows) {
  const t = el("table"); const h = el("tr");
  headers.forEach(x => h.append(el("th", null, x))); t.append(h);
  rows.forEach(r => { const tr = el("tr"); r.forEach(c => tr.append(el("td", null, String(c)))); t.append(tr); });
  return t;
}

(async () => {
  for (const p of await api("/api/projects")) $("project").append(new Option(p.name, p.name));
  $("project").onchange = refresh;
  await refresh();
  setInterval(() => refresh().catch(() => {}), 5000);
})();
</script>
</body>
</html>
