[project]
name = "chantier"
version = "0.1.0"
description = "Spec-driven code factory that routes work between local LLMs and frontier coding agents, with human gates only where they matter."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
chantier = "chantier.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "import-linter>=2.0",
    "fastapi>=0.110",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chantier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Architecture tests: the domain knows nothing about adapters, the CLI or the API.
[tool.importlinter]
root_package = "chantier"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "chantier.cli",
    "chantier.api",
    "chantier.bootstrap",
    "chantier.adapters",
    "chantier.application",
    "chantier.specs",
    "chantier.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["chantier.domain"]
forbidden_modules = ["sqlite3", "subprocess", "yaml", "rich", "fastapi"]
